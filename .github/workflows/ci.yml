# Fork CI for the dsh-tui npm product. Runs on every main push and pull
# request on standard GitHub-hosted runners. Keyless: it never calls the
# DeepSeek API (real-API validation lives in e2e.yml) and uploads no
# artifacts. The 54 MB Python runtime wheel is gone — the upstream
# python-runtime/build-exe chain was removed with the Python release
# workflows.
#
# Single `gates` job: unit tests for the product surface, typecheck, runtime
# assembly, and an npm pack dry run.
#
# Known exclusions, both pre-existing conditions of this fork:
#   - The whole-workspace `pnpm run lint` gate is red (209 pre-existing
#     oxlint findings in upstream test sources). See the NOTE in the job.
#   - The full-screen Ink render suite (packages/tui/tui/tests) passes
#     locally on Windows but cannot run on hosted runners: ink switches its
#     re-render loop off under the runner's CI environment and the suite's
#     frame assertions then see an empty frame. It never ran in this fork's
#     CI before either. Fixing it needs a product-side test change; the CLI
#     itself is still covered by the cross-platform smoke and the real-API
#     e2e.
name: CI

on:
  push:
    branches: [main]
    # Docs-only main pushes skip the whole gate: install, tests, typecheck,
    # build, assemble, and pack are pointless for content-only changes.
    # pull_request deliberately keeps NO paths filter: if CI later becomes a
    # required check, docs-only PRs must still produce a normal CI check
    # instead of a permanently pending status.
    paths-ignore:
      - 'README.md'
      - 'README.zh.md'
      - 'README.i18n.yaml'
      - 'CONTRIBUTING.md'
      - 'CONTRIBUTING.zh.md'
      - 'CONTRIBUTING.i18n.yaml'
      - 'TUI-WEB-COMPARISON.md'
      - 'BENCHMARK.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/**'
      - 'assets/**'
      - 'website/**'
      - '.agents/**'
      - '**/README.md'
      - '**/README.zh.md'
      - '**/README.i18n.yaml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  gates:
    name: dsh-tui gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The dsh-tui product surface, keyless. Trailing slashes keep the
      # vitest substring filters from also matching sibling groups such as
      # packages/session-query. Upstream repo-gate specs (scripts/**), web
      # client suites, and the full-screen render suite (see the header
      # note) stay out of this step.
      - name: Unit tests (dsh-tui surface)
        run: >-
          pnpm run test
          packages/tui/tui-app/ apps/tui-cli/ packages/core/ packages/llm/
          packages/session/ packages/credentials/ packages/settings/
          packages/interaction/ packages/agent/

      - name: Typecheck
        run: pnpm run typecheck

      # NOTE: the whole-workspace `pnpm run lint` gate is currently red on
      # this fork (209 pre-existing oxlint findings in upstream test sources,
      # e.g. deprecated `toThrowError`). It is intentionally absent from the
      # fork CI until that debt is fixed in a dedicated commit.

      # The assemble step needs both build faces: some workspace packages
      # only emit their Node entry in the client build.
      - name: Build host + client lib
        run: pnpm run build:lib

      - name: Assemble the dsh-tui bundled runtime
        run: pnpm run dsh-tui:assemble-runtime

      # Dry-run only: proves the published tarball would carry bin/ and the
      # assembled runtime/ closure without writing or publishing anything.
      - name: Pack the npm package (dry run)
        run: |
          cd apps/tui-cli
          npm pack --dry-run

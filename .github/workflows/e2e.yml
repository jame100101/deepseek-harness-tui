name: E2E (real DeepSeek API)

# Real-API end-to-end suite (`pnpm run test:e2e`). It consumes the
# DEEPSEEK_API_KEY_EXTERNAL repository secret (mapped to the DEEPSEEK_API_KEY
# env var the tests read) and calls the external API at https://api.deepseek.com
# (DEEPSEEK_BASE_URL is pinned to it explicitly so a stray repo-root .env can't
# redirect the run).
#
# Triggers are deliberately narrow for this fork:
#   - workflow_dispatch — manual pre-release validation.
#   - push to main — automatic validation of product-affecting changes only;
#     documentation-only paths are ignored below.
#   - NO pull_request: fork and Dependabot PRs therefore have no surface at
#     all to reach the secret (strictly stronger than a skip guard).
#   - NO schedule: the nightly cron was removed so an unchanged repo no
#     longer burns real API quota every day.
#
# SECURITY — never add `pull_request_target` here: it runs in the base repo's
# context WITH secrets while checking out untrusted fork code, a textbook
# key-leak vector for a public repo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Documentation-only changes never alter the runtime the real-API suite
    # exercises; skip them. Everything that can affect the product — sources,
    # manifests, lockfiles, patches, tests, fixtures, workflows, runtime
    # config — still triggers the suite.
    paths-ignore:
      - 'README.md'
      - 'README.zh.md'
      - 'README.i18n.yaml'
      - 'CONTRIBUTING.md'
      - 'CONTRIBUTING.zh.md'
      - 'CONTRIBUTING.i18n.yaml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'TUI-WEB-COMPARISON.md'
      - 'BENCHMARK.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/**'
      - 'assets/**'
      - 'website/**'
      - '.agents/**'
      # CI orchestration and the keyless cross-platform smoke do not alter
      # the product runtime the real-API suite exercises; skip them. e2e.yml
      # itself is deliberately NOT ignored: changing this workflow must run
      # once to validate the new configuration.
      - '.github/workflows/ci.yml'
      - '.github/workflows/dsh-tui-smoke.yml'
      - '**/README.md'
      - '**/README.zh.md'
      - '**/README.i18n.yaml'

# A push run is already producing the post-merge signal; never cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: this job only reads the repo to run tests.
permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: e2e
    # Bounded file parallelism (DSH_E2E_MAX_WORKERS), 120s/test, retry 2. 45m
    # still bounds retry storms against a slow API while the happy path fans out.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The with-key escalation e2e self-skips without a usable runner. Install
      # bwrap so trusted CI exercises it; the userns knob is best-effort and the
      # test's functional probe decides.
      - name: Install bubblewrap (unrestrict userns)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "apparmor userns knob absent — the functional probe decides"

      # Guard against a false green: the e2e suites self-skip when the key is
      # absent, so a missing/misconfigured secret would otherwise pass as
      # "all skipped". This job only runs on trusted events, so the secret
      # MUST be present — fail loudly if not.
      - name: Preflight (require DEEPSEEK_API_KEY)
        env:
          # Repo secret DEEPSEEK_API_KEY_EXTERNAL holds the external-API key;
          # the tests read process.env.DEEPSEEK_API_KEY, so map it across here.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY is empty. The e2e suite would self-skip and"
            echo "::error::report a false green. Configure the repo secret DEEPSEEK_API_KEY_EXTERNAL."
            exit 1
          fi
          echo "DEEPSEEK_API_KEY present."

      # The e2e suites boot the example bins in `lib` mode (DSH_EXAMPLE_MODE=lib):
      # the built artifact under plain Node, resolving plugins through real package
      # exports — the shape a real consumer runs. That requires a prior build.
      - name: Build (lib for the e2e example bins)
        run: pnpm run build

      # Real-API end-to-end tests only. The keyless gates (lint/typecheck/
      # coverage/snapshot/etc.) already run in ci.yml on every push/PR.
      # DEEPSEEK_BASE_URL is pinned to the external API; the secret is scoped to
      # this step (and preflight) only — never exposed to checkout/setup/install.
      - name: E2E tests (real DeepSeek API)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DSH_E2E_MAX_WORKERS: 14
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
